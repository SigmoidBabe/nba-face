# Install: python -m pip install -e ./packages/nba-face
# Set the PostgreSQL connection URL under config.db.url.
- runtime_id: nba.face
  package:
    entry_point: nba.face
  grpc_apis:
    - face.registration
    - face.performance
  config:
    # Required deployment settings (no defaults).
    model:
      face_detection:
        engine: /opt/models/face-yolov8.engine
        operations_per_inference: 0
      face_extraction:
        engine: /opt/models/arcface.engine
        operations_per_inference: 0
    registration_image_dir: /var/lib/cv-demo/nba-face/images
    db:
      url: 'postgresql://USER:PASSWORD@HOST:5432/DATABASE'
      # statement_timeout_ms: 5000
    # Required for calculate_tops: set actual operations per single model item.
    # Detection processes one frame; ArcFace extracts one face per frame.
    # No operation counts are inferred from the engine filenames.
    # Optional overrides; omitted settings use these defaults.
    # device: 0
    # detector_size: [640, 640]
    # detector_layout: BCN
    # face_label: face  # Class name from /opt/models/face-yolov8.txt.
    # batch_size: 8
    # score_threshold: 0.7
    # iou_threshold: 0.4
    # similarity_threshold: 0.6
    # minimum_face_size: 0
    # crop_margin: 0.2
    # max_faces: 100
  capabilities:
    - id: face.recognition
      output_modes: [periodic, event]
